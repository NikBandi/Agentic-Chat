<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Chat</title>
<link rel="icon" href="data:,">
<style>
/* ---- tokens: washi light / sumi dark; color only means something ---------------------------- */
:root{
  --bg:#F4F1EA;--surface:#FBF9F4;--surface-2:#EDE8DD;--ink:#2B2A27;--ink-soft:#69645A;--line:#E2DDD2;
  --moss:#56684C;--indigo:#3E5C76;--persimmon:#B5562F;--ochre:#765A1B;--ochre-bg:#E9DDBF;--beni:#9E3B3B;
  --on-accent:#FFFFFF;--shadow:0 1px 2px rgb(0 0 0 / .04);color-scheme:light;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1B1A18;--surface:#23221F;--surface-2:#2C2A26;--ink:#E6E1D6;--ink-soft:#9C968A;--line:#34322D;
  --moss:#8FA67F;--indigo:#7E9CB8;--persimmon:#D9825B;--ochre:#C9A85A;--ochre-bg:#3A3322;--beni:#D97C7C;
  --on-accent:#1B1A18;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#1B1A18;--surface:#23221F;--surface-2:#2C2A26;--ink:#E6E1D6;--ink-soft:#9C968A;--line:#34322D;
  --moss:#8FA67F;--indigo:#7E9CB8;--persimmon:#D9825B;--ochre:#C9A85A;--ochre-bg:#3A3322;--beni:#D97C7C;
  --on-accent:#1B1A18;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
code,.mono,pre{font-family:var(--mono);font-size:12.5px}
h1,h2,h3{font-weight:500;margin:0}
h2{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:14px}
h3{font-size:13px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.soft{color:var(--ink-soft)}
.small{font-size:12.5px}
.empty{color:var(--ink-soft);padding:6px 0}

/* ---- buttons ---- */
.btn{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 12px;cursor:pointer;line-height:1.4;transition:background-color .16s ease-out,opacity .16s ease-out}
.btn:hover{background:var(--surface-2)}
.btn.quiet{border-color:var(--line)}
.btn.fill-moss{background:var(--moss);color:var(--on-accent)}
.btn.fill-moss:hover{opacity:.9}
.btn.fill-beni{background:var(--beni);color:var(--on-accent)}
.btn.fill-beni:hover{opacity:.9}
.btn.link{padding:0;border:0;color:var(--indigo);background:none}
.btn.link:hover{text-decoration:underline}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input::placeholder{color:var(--ink-soft)}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:14px clamp(16px,4vw,40px);background:var(--bg)}
.top h1{font-size:15px;letter-spacing:.02em}
.conn{display:flex;align-items:center;gap:7px;color:var(--ink-soft);font-size:12.5px}
.spacer{flex:1}
.pill{border:0;border-radius:999px;padding:4px 14px;background:var(--persimmon);color:var(--on-accent);cursor:pointer;font-size:13px}
.pill[hidden]{display:none}

/* ---- status dots + chips (never color alone: always a label) ---- */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--ink-soft)}
.s-open{--c:var(--ink-soft)}.s-in_progress{--c:var(--indigo)}.s-review{--c:var(--ochre)}
.s-approved{--c:var(--moss)}.s-merged{--c:var(--moss)}.s-dropped{--c:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.chip .dot{background:var(--c)}
.chip.s-in_progress,.chip.s-approved{color:var(--c)}
.chip.s-review{color:var(--ochre)}
.chip.s-merged .dot{opacity:.6}
.chip.s-dropped .lbl{text-decoration:line-through}
.dot.a-active{background:var(--moss)}.dot.a-waiting{background:var(--indigo)}.dot.a-inactive{background:var(--ochre)}.dot.a-done{background:var(--ink-soft)}.dot.a-idle{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-soft)}
.dot.conn-on{background:var(--moss)}.dot.conn-off{background:var(--beni)}
.dep{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2)}
.dep.waiting{color:var(--ink-soft)}
.pass{color:var(--moss)}.fail{color:var(--beni)}

/* ---- layout: space, not boxes ---- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-areas:"needs needs" "tasks side" "msgs side";gap:44px clamp(24px,4vw,56px);padding:8px clamp(16px,4vw,40px) 40px;align-items:start}
.area{min-width:0;scroll-margin-top:72px}
#needs{grid-area:needs}#tasks{grid-area:tasks}#msgs{grid-area:msgs}.side{grid-area:side;display:flex;flex-direction:column;gap:44px;min-width:0}
@media (max-width:1000px){.layout{grid-template-columns:1fr;grid-template-areas:"needs" "tasks" "msgs" "side";gap:36px}}
.panel{background:var(--surface);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow)}
@media (max-width:560px){.panel{padding:18px 16px}}

/* ---- needs you ---- */
.calm-line{color:var(--ink-soft);padding:2px 0}
.mr{background:var(--surface);border-radius:14px;padding:20px 24px;box-shadow:var(--shadow);border-left:3px solid var(--persimmon);display:flex;flex-direction:column;gap:10px}
.mr + .mr{margin-top:14px}
.mr-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.mr-title{font-size:15px;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-soft);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reason{flex:1;min-width:200px}
pre.out{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:0;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.5}
details>summary{cursor:pointer;color:var(--ink-soft);font-size:12.5px;list-style:none;width:fit-content}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;width:1em;transition:transform .16s ease-out}
details[open]>summary::before{transform:rotate(90deg)}
details[open]>summary{margin-bottom:8px}
.tome{display:flex;gap:12px;align-items:baseline;padding:10px 0}
.tome + .tome{border-top:1px solid var(--line)}

/* ---- task board ---- */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
@media (max-width:1300px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.col h3{font-size:12px;letter-spacing:.06em;color:var(--ink-soft);font-weight:500;display:flex;gap:6px;align-items:center;margin-bottom:10px}
.tcard{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:background-color .16s ease-out}
.tcard:hover{background:var(--surface-2)}
.tcard .t{font-weight:500;display:block;margin-bottom:6px;overflow-wrap:anywhere}
.tcard .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink-soft)}
.tcard.dropped .t{text-decoration:line-through;color:var(--ink-soft)}
.morebtn{font-size:12.5px}

/* ---- side panel (task / agent details) ---- */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .18);opacity:0;pointer-events:none;transition:opacity .18s ease-out;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:21;padding:28px 30px;overflow:auto;transform:translateX(100%);transition:transform .2s ease-out;box-shadow:-1px 0 2px rgb(0 0 0 / .04)}
.drawer.on{transform:none}
.drawer .close{position:absolute;top:18px;right:18px}
.drawer h2.dt{font-size:17px;letter-spacing:0;color:var(--ink);margin:0 40px 6px 0}
.drawer section{margin-top:26px}
.drawer h3{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);font-weight:500;margin-bottom:8px}
.files{margin:0;padding:0;list-style:none}
.files li{font-family:var(--mono);font-size:12.5px;padding:2px 0;overflow-wrap:anywhere}
.brief{white-space:pre-wrap;overflow-wrap:anywhere}
.hist{padding:14px 0}
.hist + .hist{border-top:1px solid var(--line)}

/* ---- agents ---- */
.tabs{display:flex;gap:2px;margin:0 -6px 16px;flex-wrap:wrap}
.tab{border:0;background:none;border-radius:999px;padding:3px 9px;font-size:13px;cursor:pointer;color:var(--ink-soft)}
.tab[aria-selected=true]{background:var(--surface-2);color:var(--ink)}
@media (max-width:560px){.tab{padding:3px 6px;font-size:12.5px}}
.acard{display:block;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:12px 12px;cursor:pointer;transition:background-color .16s ease-out,opacity .18s ease-out}
.acard:hover{background:var(--surface-2)}
.acard.dim{opacity:.62}
.acard + .acard,.awrap + .awrap,.acard + .awrap,.awrap + .acard{margin-top:6px}
.aname{display:flex;align-items:center;gap:8px;font-weight:500}
.aname .role{font-weight:400;color:var(--ink-soft);font-size:12.5px}
.steps{display:flex;gap:4px;margin:10px 0 6px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.past{background:var(--ink-soft);opacity:.45}
.steps i.now{background:var(--c)}
.afacts{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--ink-soft)}
.lastmsg{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.notes{margin:6px 0 0;padding-left:16px;font-size:12.5px}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 12px 12px}

/* ---- claims ---- */
.cgroup + .cgroup{margin-top:16px}
.cgroup h3{font-size:13px;font-weight:500;margin-bottom:4px}
.claim{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:2px 0}
.claim code{overflow-wrap:anywhere}
.subtle-h{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);margin:22px 0 8px}

/* ---- messages ---- */
.chat{display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px}
@media (max-width:640px){.chat{grid-template-columns:1fr}}
.chans{display:flex;flex-direction:column;gap:2px}
@media (max-width:640px){.chans{flex-direction:row;flex-wrap:wrap}}
.chan{display:flex;justify-content:space-between;gap:8px;border:0;background:none;border-radius:8px;padding:5px 10px;text-align:left;cursor:pointer;color:var(--ink-soft)}
.chan:hover{background:var(--surface-2)}
.chan[aria-current=true]{background:var(--surface-2);color:var(--ink)}
.unread{font-size:11.5px;min-width:20px;text-align:center;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chan[aria-current=true] .unread{background:var(--surface)}
.unread.me{background:var(--persimmon);color:var(--on-accent)}
.feedwrap{display:flex;flex-direction:column;min-width:0}
.feed{height:380px;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.m{padding:7px 12px;border-radius:10px;border-left:3px solid transparent;overflow-wrap:anywhere;white-space:pre-wrap}
.m .who{font-weight:500}
.m .when{color:var(--ink-soft);font-size:11.5px;margin-left:8px}
.m.mine{background:var(--surface-2)}
.m.tome-m{border-left-color:var(--persimmon)}
.m.sys{font-size:12.5px;color:var(--ink-soft);padding:3px 12px}
.m.sys .who{font-weight:400}
.compose{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative}
.compose .to{width:150px}
.compose .text{flex:1;min-width:180px}
.ac{position:absolute;bottom:calc(100% + 6px);left:0;min-width:200px;max-height:220px;overflow:auto;background:var(--surface);border-radius:10px;box-shadow:0 1px 2px rgb(0 0 0 / .04),0 0 0 1px var(--line);padding:4px;margin:0;list-style:none;z-index:5}
.ac li{padding:4px 10px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12.5px}
.ac li[aria-selected=true]{background:var(--surface-2)}

/* ---- quiet log ---- */
.quietlog{padding:0 clamp(16px,4vw,40px) 40px}
.quietlog .log{max-height:280px;overflow:auto;font-size:12.5px;color:var(--ink-soft)}
.quietlog .log div{padding:2px 0}

/* ---- narrow top bar: one line, labels stay for screen readers ---- */
.top h1,.pill,#themeBtn{white-space:nowrap}
@media (max-width:560px){.top{gap:10px}.conn .lbl-wide,#themeBtn .lbl-wide{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}

/* ---- toasts ---- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:30;max-width:min(380px,calc(100vw - 36px))}
.toast{background:var(--surface);border-left:3px solid var(--beni);border-radius:10px;padding:10px 14px;box-shadow:0 1px 2px rgb(0 0 0 / .06),0 0 0 1px var(--line)}

/* ---- motion: soft fades only ---- */
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.enter{animation:fadein .18s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Agentic Chat</h1>
  <span class="conn" role="status"><span class="dot conn-off" id="connDot"></span><span id="connTxt" class="lbl-wide">connecting</span></span>
  <span class="spacer"></span>
  <button class="pill" id="needPill" hidden></button>
  <button class="btn quiet" id="themeBtn" type="button"></button>
</header>

<main class="layout">
  <section class="area" id="needs" aria-labelledby="needsH" aria-live="polite">
    <h2 id="needsH">Needs you</h2>
    <div id="needsBody"></div>
  </section>

  <section class="area" id="tasks" aria-labelledby="tasksH">
    <h2 id="tasksH">Tasks</h2>
    <div id="board"></div>
  </section>

  <section class="area" id="msgs" aria-labelledby="msgsH">
    <h2 id="msgsH">Messages</h2>
    <div class="panel chat">
      <nav class="chans" id="chans" aria-label="Channels"></nav>
      <div class="feedwrap">
        <div class="feed" id="feed" tabindex="0" aria-live="polite" aria-label="Messages in channel"></div>
        <form class="compose" id="compose" autocomplete="off">
          <label class="sr" for="to">Send to</label>
          <input class="to" id="to" placeholder="#channel or @agent">
          <label class="sr" for="text">Message</label>
          <input class="text" id="text" placeholder="Write as you — Enter sends">
          <button class="btn fill-moss" type="submit">Send</button>
          <ul class="ac" id="ac" role="listbox" aria-label="Suggestions" hidden></ul>
        </form>
      </div>
    </div>
  </section>

  <div class="side">
    <section class="area" id="agentsArea" aria-labelledby="agentsH">
      <h2 id="agentsH">Agents</h2>
      <div class="panel"><div class="tabs" role="tablist" aria-label="Agent groups" id="tabs"></div><div id="agentList" role="tabpanel"></div></div>
    </section>
    <section class="area" id="claimsArea" aria-labelledby="claimsH">
      <h2 id="claimsH">Claims</h2>
      <div class="panel" id="claims"></div>
    </section>
  </div>
</main>

<div class="quietlog"><details id="quietLog"><summary>Quiet log</summary><div class="log" id="log"></div></details></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <button class="btn quiet close" id="drawerClose" type="button">Close</button>
  <div id="drawerBody"></div>
</aside>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const HUMAN = 'you';
const STEPS = ['taken', 'checking', 'review', 'approved', 'merged'];
const STATUS_LABEL = { open: 'Open', in_progress: 'In progress', review: 'Review', approved: 'Approved', merged: 'Merged', dropped: 'Dropped' };
const AGENT_TABS = ['active', 'waiting', 'idle', 'done', 'inactive'];
const TAB_LABEL = { active: 'Active', waiting: 'Waiting', idle: 'Idle', done: 'Done', inactive: 'Inactive' };
const TAB_HINT = { waiting: 'blocked in bus wait', idle: 'no task in progress, not in bus wait' };
let S = null;

// ---- small helpers ------------------------------------------------------------------------------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k); // strings become text nodes (no innerHTML)
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode: fine */ } },
};
function ago(ts) {
  if (!ts) return 'never';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const short = (sha) => (sha ? String(sha).slice(0, 7) : '');
function toast(msg) {
  const d = h('div', { class: 'toast enter' }, String(msg));
  $('toasts').append(d);
  setTimeout(() => d.remove(), 5000);
}
const chip = (status) => h('span', { class: 'chip s-' + status }, h('span', { class: 'dot', 'aria-hidden': 'true' }), h('span', { class: 'lbl' }, STATUS_LABEL[status] || status));

function fill(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); } // nulls from conditionals never become text
// Fade in only what is new to a container since the last render.
const seen = new Map();
function enter(container, key, el) {
  const set = seen.get(container) || new Set();
  if (seen.has(container) && !set.has(key)) el.classList.add('enter');
  set.add(key); seen.set(container, set);
  return el;
}

// ---- theme: auto (system) -> light -> dark, remembered -------------------------------------------
const THEMES = ['auto', 'light', 'dark'];
let theme = store.get('busTheme', 'auto');
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  fill($('themeBtn'), h('span', { class: 'lbl-wide' }, 'Theme: '), theme);
  $('themeBtn').setAttribute('aria-label', 'Theme: ' + theme + '. Change theme');
}
$('themeBtn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; store.set('busTheme', theme); applyTheme(); });
applyTheme();

// ---- human token: arrives once in the #t=... link, then lives in sessionStorage (this tab only) ---
const HUMAN_TOKEN = (() => {
  try {
    const m = /[#&]t=([^&]+)/.exec(location.hash);
    if (m) {
      sessionStorage.setItem('busHumanToken', decodeURIComponent(m[1]));
      history.replaceState(null, '', location.pathname + location.search); // keep it out of the address bar
    }
    return sessionStorage.getItem('busHumanToken') || '';
  } catch { return ''; }
})();
const HUMAN_HDR = HUMAN_TOKEN ? { 'x-bus-human': HUMAN_TOKEN } : {};

async function api(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', ...HUMAN_HDR }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.status + ' ' + r.statusText);
    refresh();
    return j;
  } catch (e) { toast(e.message); return null; }
}

// ---- live updates: SSE -> coalesced single-flight fetch of /api/state --------------------------
let inflight = false, again = false;
async function refresh() {
  if (inflight) { again = true; return; }
  inflight = true;
  try {
    const r = await fetch('/api/state', { headers: HUMAN_HDR });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'state ' + r.status);
    S = await r.json();
    render();
  } catch (e) { toast('Refresh failed: ' + e.message); }
  inflight = false;
  if (again) { again = false; refresh(); }
}
let timer = 0;
function schedule() { clearTimeout(timer); timer = setTimeout(refresh, 80); }
function connect() {
  const es = new EventSource('/api/events' + (HUMAN_TOKEN ? '?t=' + encodeURIComponent(HUMAN_TOKEN) : ''));
  es.addEventListener('change', schedule);

  fill($('log'), ...[...S.activity].sort((a, b) => b.ts - a.ts).slice(0, 150).map((a) => h('div', {}, h('span', { class: 'mono' }, clock(a.ts)), '  ', a.text)));
}
$('quietLog').addEventListener('toggle', () => { if (S) renderLog(); });

// ---- side panel: task or agent details ----
const drawer = { kind: null, key: null, openerId: null };
const dropping = new Set();
function openDrawer(kind, key) {
  drawer.kind = kind; drawer.key = key; if (!drawer.openerId || !$('drawer').contains(document.activeElement)) drawer.openerId = document.activeElement?.id || null;
  $('drawer').hidden = false;
  requestAnimationFrame(() => { $('drawer').classList.add('on'); $('scrim').classList.add('on'); });
  renderDrawer();
  $('drawerClose').focus();
}
function closeDrawer() {
  if (!drawer.kind) return;
  drawer.kind = null;
  $('drawer').classList.remove('on'); $('scrim').classList.remove('on');
  setTimeout(() => { if (!drawer.kind) $('drawer').hidden = true; }, 200);
  if (drawer.openerId) $(drawer.openerId)?.focus(); // by id: live re-renders replace the element
  drawer.openerId = null;
}
$('drawerClose').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawer.kind && $('ac').hidden) closeDrawer();
  if (e.key === 'Tab' && drawer.kind) { // keep focus inside the panel
    const f = [...$('drawer').querySelectorAll('button,select,input,summary,[tabindex="0"]')].filter((x) => !x.disabled && x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
function renderDrawer() {
  const body = $('drawerBody');
  const scroll = $('drawer').scrollTop;
  if (drawer.kind === 'task') {
    const t = taskById(drawer.key);
    if (!t) return closeDrawer();
    fill(body, ...taskDetail(t));
  } else {
    const a = S.agents[drawer.key];
    if (!a) return closeDrawer();
    fill(body, ...agentDetail(a));
  }
  $('drawer').scrollTop = scroll;
}
function taskDetail(t) {
  const live = t.status !== 'merged' && t.status !== 'dropped';
  const sel = 'ra-task-' + t.id;
  const r = t.result;
  return [
    h('h2', { class: 'dt', id: 'drawerTitle' }, '#' + t.id + ' ' + t.title),
    h('div', { class: 'meta' }, chip(t.status), h('span', {}, t.owner || (t.assignee ? '→ ' + t.assignee : 'unassigned')), h('span', {}, 'updated ' + ago(t.updatedAt))),
    t.brief ? h('section', {}, h('h3', {}, 'Brief'), h('p', { class: 'brief' }, t.brief)) : null,
    h('section', {}, h('h3', {}, 'Files'), (t.files || []).length ? h('ul', { class: 'files' }, t.files.map((f) => h('li', {}, f))) : h('p', { class: 'soft' }, 'None')),
    (t.after || []).length ? h('section', {}, h('h3', {}, 'Waits on'), h('p', {}, t.after.map((d) => { const dt = taskById(d); return h('span', { class: 'dep' + (dt && dt.status === 'merged' ? '' : ' waiting'), style: 'margin-right:6px' }, '#' + d + ' ' + (dt ? STATUS_LABEL[dt.status].toLowerCase() : '?')); }))) : null,
    h('section', {}, h('h3', {}, 'Done-check'), h('code', {}, t.check),
      r ? h('p', { style: 'margin-top:8px' }, h('span', { class: r.ok ? 'pass' : 'fail' }, r.ok ? 'Passed' : 'Failed (exit ' + r.code + ')'), h('span', { class: 'soft' }, ' · ' + (t.checkRuns || 1) + ' run' + ((t.checkRuns || 1) === 1 ? '' : 's') + (r.ms != null ? ' · ' + (r.ms / 1000).toFixed(1) + 's' : ''))) : h('p', { class: 'soft', style: 'margin-top:8px' }, 'Not run yet'),
      r ? h('pre', { class: 'out', style: 'margin-top:8px' }, r.output || '(no output)') : null),
    t.branch || t.commit ? h('section', {}, h('h3', {}, 'Branch'), h('p', { class: 'mono' }, (t.branch || '?') + (t.commit ? ' @ ' + short(t.commit) : ''))) : null,
    t.summary ? h('section', {}, h('h3', {}, 'Summary'), h('p', {}, t.summary)) : null,
    t.report ? h('section', {}, h('h3', {}, 'Report'), h('pre', { class: 'out' }, t.report.text)) : null,
    live ? h('section', {}, h('h3', {}, 'Actions'),
      h('form', { class: 'actions', onsubmit: (e) => { e.preventDefault(); api('/api/task/reassign', { id: t.id, to: $(sel).value }); } },
        h('label', { for: sel, class: 'small soft' }, 'Reassign to'),
        h('select', { id: sel }, Object.keys(S.agents).map((n) => h('option', { value: n }, n))),
        h('button', { class: 'btn quiet', type: 'submit' }, 'Reassign')),
      h('div', { class: 'actions', style: 'margin-top:12px' }, dropping.has(t.id)
        ? [h('span', { class: 'small' }, 'Drop #' + t.id + '? Its claims are released.'),
           h('button', { class: 'btn fill-beni', type: 'button', onclick: () => { dropping.delete(t.id); api('/api/task/drop', { id: t.id }); } }, 'Drop task'),
           h('button', { class: 'btn quiet', type: 'button', onclick: () => { dropping.delete(t.id); renderDrawer(); } }, 'Keep')]
        : h('button', { class: 'btn quiet', type: 'button', onclick: () => { dropping.add(t.id); renderDrawer(); } }, 'Drop…'))) : null,
  ];
}
function agentDetail(a) {
  const state = agentState(a);
  const took = S.tasks.filter((t) => t.owner === a.name);
  const ps = partners(a);
  return [
    h('h2', { class: 'dt', id: 'drawerTitle' }, a.name),
    h('div', { class: 'meta' }, h('span', { class: 'chip' }, h('span', { class: 'dot a-' + state, 'aria-hidden': 'true' }), TAB_LABEL[state]),
      h('span', {}, (a.name === 'lead' ? 'lead' : 'worker') + ' · team ' + (a.team || '-')), h('span', {}, 'seen ' + ago(a.lastSeen)),
      a.worktree ? h('span', { class: 'mono', style: 'overflow-wrap:anywhere' }, a.worktree) : null),
    h('section', {}, h('h3', {}, 'Tasks'), took.length ? took.slice().reverse().map((t) => h('div', { class: 'hist' },
      h('div', { class: 'mr-head' }, h('button', { class: 'btn link', type: 'button', onclick: () => openDrawer('task', t.id) }, '#' + t.id + ' ' + t.title), chip(t.status)),
      h('div', { class: 'meta', style: 'margin-top:4px' },
        t.commit ? h('span', { class: 'mono' }, short(t.commit) + ' on ' + (t.branch || '?')) : null,
        t.result ? h('span', { class: t.result.ok ? 'pass' : 'fail' }, (t.result.ok ? 'passed' : 'failed') + ' · ' + (t.checkRuns || 1) + ' run' + ((t.checkRuns || 1) === 1 ? '' : 's')) : h('span', {}, 'no check yet'),
        t.takenAt ? h('span', {}, 'taken ' + ago(t.takenAt)) : null),
      t.report ? [
        h('ul', { class: 'notes' }, (t.report.notes && t.report.notes.length ? t.report.notes : ['(no notes)']).map((l) => h('li', {}, l))),
        h('div', { style: 'margin-top:8px' }, det('agrep' + t.id, 'Full report (with the facts the bus recorded)', h('pre', { class: 'out' }, t.report.text)))] : null))
      : h('p', { class: 'soft' }, 'No tasks taken yet.')),
    h('section', {}, h('h3', {}, 'Talked with'), ps.length ? ps.map(([k, e]) => h('div', { class: 'claim' },
      h('span', { class: 'mono' }, k), h('span', { class: 'soft' }, e.sent && e.received ? `↔ ${e.sent} sent, ${e.received} received` : e.sent ? `→ ${e.sent} sent` : `← ${e.received} received`)))
      : h('p', { class: 'soft' }, 'No messages yet.')),
  ];
}

setInterval(() => { if (S) render(); }, 30000); // keep relative times fresh
connect();
refresh();
</script>
